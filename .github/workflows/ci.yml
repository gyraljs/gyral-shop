# Runs LOCALLY only: `pnpm ci:local` (gh act + Docker). See docs/design-docs/0004-local-ci.md.
# Do not add push / pull_request / schedule triggers: scripts/check-workflows.mjs rejects them.
name: ci

on:
  workflow_dispatch:

# Actions are pinned by commit, Node by exact patch, each two weeks old (Gyral's ADR 0032):
# move them with the dependency updates. pnpm/action-setup installs the pnpm version named by
# `packageManager` in package.json.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
