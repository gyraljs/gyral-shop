# Runs LOCALLY only: `pnpm ci:local` (gh act + Docker). See docs/design-docs/0004-local-ci.md.
# Do not add push / pull_request / schedule triggers: scripts/check-workflows.mjs rejects them.
name: ci

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
