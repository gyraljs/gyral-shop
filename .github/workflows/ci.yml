# Runs LOCALLY only: `pnpm ci:local` (gh act + Docker). See docs/design-docs/0004-local-ci.md.
# Do not add push / pull_request / schedule triggers: scripts/check-workflows.mjs rejects them.
# Note: Gyral is linked from ../cyclejs-web-framework, so this workflow checks out both repos.
name: ci

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gyral-shop
      - uses: actions/checkout@v4
        with:
          repository: mikezupper/gyral
          path: cyclejs-web-framework
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: gyral-shop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: cyclejs-web-framework
      - run: pnpm install --frozen-lockfile
        working-directory: gyral-shop
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: gyral-shop
      - run: pnpm check
        working-directory: gyral-shop
