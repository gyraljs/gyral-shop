    --line-strong: light-dark(oklch(60% 0.015 250), oklch(55% 0.015 250));
    --danger: light-dark(oklch(48% 0.19 25), oklch(74% 0.15 25));
    --focus: oklch(60% 0.18 250);

@layer base {

  .skip-link {
    position: absolute;
